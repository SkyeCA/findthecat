<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Box Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen picker">
    <div id="frame" class="frame">
      <img id="photo" alt="" draggable="false">
    </div>
    <div class="controls">
      <button id="prev">Prev</button>
      <p id="position"></p>
      <button id="next">Next</button>
      <button id="undo">Undo</button>
      <button id="copy">Copy</button>
    </div>
    <textarea id="output" readonly spellcheck="false"></textarea>
  </main>

  <script src="boxes.js"></script>
  <script>
    const STORAGE_KEY = "catPicks";
    const MIN_SIZE = 0.005;

    const el = (id) => document.getElementById(id);
    const frame = el("frame");
    const photo = el("photo");
    const output = el("output");

    // Drafts survive a reload, so the job can be done in more than one sitting.
    const picks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    for (const cat of CATS) picks[cat.src] ??= cat.boxes;

    let index = CATS.findIndex((cat) => !picks[cat.src].length);
    if (index === -1) index = 0;
    let anchor = null;
    let preview = null;

    function addBox() {
      const box = document.createElement("div");
      box.className = "box lived";
      frame.append(box);
      return box;
    }

    function placeBox(box, { x, y, w, h }) {
      box.style.cssText = `left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%`;
    }

    function formatBox({ x, y, w, h }) {
      return `{ x: ${x}, y: ${y}, w: ${w}, h: ${h} }`;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
    }

    function render() {
      const src = CATS[index].src;
      photo.src = src;
      frame.querySelectorAll(".box").forEach((box) => box.remove());
      for (const saved of picks[src]) placeBox(addBox(), saved);
      el("undo").disabled = !picks[src].length;

      const done = CATS.filter((cat) => picks[cat.src].length).length;
      el("position").textContent = `${index + 1} / ${CATS.length} (${done} set)`;

      const rows = CATS.map((cat) => {
        return `  { src: ${JSON.stringify(cat.src)}, boxes: [${picks[cat.src].map(formatBox).join(", ")}] },`;
      });
      output.value = `const CATS = [\n${rows.join("\n")}\n];\n`;
    }

    function go(step) {
      index = (index + step + CATS.length) % CATS.length;
      render();
    }

    function pointerPosition(event) {
      const rect = frame.getBoundingClientRect();
      const clamp = (value) => Math.min(1, Math.max(0, value));
      return {
        x: clamp((event.clientX - rect.left) / rect.width),
        y: clamp((event.clientY - rect.top) / rect.height),
      };
    }

    function boxFrom(a, b) {
      const round = (value) => Number(value.toFixed(4));
      return {
        x: round(Math.min(a.x, b.x)),
        y: round(Math.min(a.y, b.y)),
        w: round(Math.abs(a.x - b.x)),
        h: round(Math.abs(a.y - b.y)),
      };
    }

    photo.addEventListener("load", () => {
      frame.style.setProperty("--ratio", photo.naturalWidth / photo.naturalHeight);
    });

    frame.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      frame.setPointerCapture(event.pointerId);
      anchor = pointerPosition(event);
      preview = addBox();
    });

    frame.addEventListener("pointermove", (event) => {
      if (anchor) placeBox(preview, boxFrom(anchor, pointerPosition(event)));
    });

    frame.addEventListener("pointerup", (event) => {
      if (!anchor) return;
      const drawn = boxFrom(anchor, pointerPosition(event));
      anchor = null;
      if (drawn.w >= MIN_SIZE && drawn.h >= MIN_SIZE) {
        const src = CATS[index].src;
        picks[src] = [...picks[src], drawn];
        save();
      }
      render();
    });

    el("prev").addEventListener("click", () => go(-1));
    el("next").addEventListener("click", () => go(1));
    el("undo").addEventListener("click", () => {
      const src = CATS[index].src;
      picks[src] = picks[src].slice(0, -1);
      save();
      render();
    });
    el("copy").addEventListener("click", (event) => {
      output.select();
      document.execCommand("copy");
      event.target.textContent = "Copied";
      setTimeout(() => (event.target.textContent = "Copy"), 1500);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === "ArrowRight") go(1);
    });

    render();
  </script>
</body>
</html>
